version: "3.8"

services:
  app:
    image: sheikhvalora/tribel-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    container_name: tribel
    depends_on:
      - redis

  redis:
    image: redis
    ports:
      - "6379:6379"
    container_name: redis-server
    volumes:
      - redis-data:/data
    env_file:
      - .env
    command: sh -c 'redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"'
    restart: unless-stopped

volumes:
  redis-data:
